name: Continuous Integration

on:
  push:
  pull_request:

permissions: {}

concurrency:
  group: >-
    ci-${{
      github.event.pull_request.number
      || github.ref
    }}
  cancel-in-progress: true

jobs:
  release_gate:
    name: Full release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up minimum supported Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.9'

      - name: Install pinned developer-only checks
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python3 -m pip install \
              --disable-pip-version-check \
              --requirement requirements-dev.txt; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep "$((attempt * 5))"
            fi
          done
          exit 1

      - name: Run exact full release gate
        run: ./release_gate.sh "$GITHUB_SHA"
