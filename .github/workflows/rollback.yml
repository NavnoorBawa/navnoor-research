name: Rebuild and Roll Back Pages

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact full commit SHA from main to rebuild and restore
        required: true
        type: string
      confirmation:
        description: Type ROLLBACK to authorize the production restore
        required: true
        type: string

permissions: {}

jobs:
  static_analysis:
    name: Isolated selected-revision static analysis
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out trusted current rollback workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate rollback authority and selected revision
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          REMOTE_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail
          [ "$CONFIRMATION" = 'ROLLBACK' ]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          remote_main=$(
            git ls-remote --exit-code "$REMOTE_URL" refs/heads/main |
              awk 'NR == 1 { print $1 }'
          )
          [[ "$remote_main" =~ ^[0-9a-f]{40}$ ]]
          [ "$remote_main" = "$GITHUB_SHA" ]
          [ "$(git rev-parse --verify "${RELEASE_SHA}^{commit}")" = "$RELEASE_SHA" ]
          git merge-base --is-ancestor "$RELEASE_SHA" "$GITHUB_SHA"

      - name: Check out exact selected release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: selected
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python for static analysis
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pinned developer-only checks
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python3 -m pip install \
              --disable-pip-version-check \
              --requirement selected/requirements-dev.txt; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep "$((attempt * 5))"
            fi
          done
          exit 1

      - name: Lint and type-check selected production code
        shell: bash
        run: |
          set -euo pipefail
          cd selected
          ruff check .
          mypy --cache-dir "$RUNNER_TEMP/mypy-cache"

  build:
    name: Rebuild selected main revision
    if: github.ref == 'refs/heads/main'
    needs: static_analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    outputs:
      manifest_sha256: ${{ steps.release.outputs.manifest_sha256 }}

    steps:
      - name: Check out trusted current rollback workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate rollback authority and selected revision
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          REMOTE_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail
          [ "$CONFIRMATION" = 'ROLLBACK' ]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          remote_main=$(
            git ls-remote --exit-code "$REMOTE_URL" refs/heads/main |
              awk 'NR == 1 { print $1 }'
          )
          [[ "$remote_main" =~ ^[0-9a-f]{40}$ ]]
          [ "$remote_main" = "$GITHUB_SHA" ]
          [ "$(git rev-parse --verify "${RELEASE_SHA}^{commit}")" = "$RELEASE_SHA" ]
          git merge-base --is-ancestor "$RELEASE_SHA" "$GITHUB_SHA"

      - name: Check out exact selected release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: selected
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up deterministic Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Run selected commit's standard-library release gate
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          cd selected
          [ "$(git rev-parse --verify HEAD)" = "$RELEASE_SHA" ]
          test -z "$(git status --porcelain --untracked-files=normal)"
          python3 -m unittest discover -s . -p 'test_*.py' -v
          python3 validate_data.py
          python3 refresh_companies.py --offline
          python3 refresh_news.py --offline
          python3 build_site.py --revision "$RELEASE_SHA"
          python3 validate_release.py --expected-revision "$RELEASE_SHA"
          python3 smoke_test_site.py --expected-revision "$RELEASE_SHA"
          python3 -m py_compile ./*.py ./navnoor_research/*.py ./navnoor_research/adapters/*.py
          for file in ./*.sh; do
            if [ -f "$file" ]; then
              bash -n "$file"
            fi
          done
          git diff --check
          [ "$(git rev-parse --verify HEAD)" = "$RELEASE_SHA" ]
          test -z "$(git status --porcelain --untracked-files=normal)"

      - name: Record exact rebuilt manifest identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          manifest_sha256=$(python3 - <<'PY'
          import hashlib
          from pathlib import Path

          print(hashlib.sha256(Path("selected/_site/release.json").read_bytes()).hexdigest())
          PY
          )
          [[ "$manifest_sha256" =~ ^[0-9a-f]{64}$ ]]
          echo "manifest_sha256=$manifest_sha256" >> "$GITHUB_OUTPUT"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload exact rebuilt rollback artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: selected/_site
          include-hidden-files: true
          retention-days: 7

  deploy:
    name: Deploy and certify selected revision
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: pages-production
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out trusted current smoke tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up deterministic Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Reconfirm trusted current-main rollback authority
        id: current
        shell: bash
        env:
          REMOTE_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail
          remote_main=$(
            git ls-remote --exit-code "$REMOTE_URL" refs/heads/main |
              awk 'NR == 1 { print $1 }'
          )
          [[ "$remote_main" =~ ^[0-9a-f]{40}$ ]]
          if [ "$remote_main" != "$GITHUB_SHA" ]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Superseded rollback skipped::Current main is $remote_main."
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"

      - name: Deploy selected exact Pages artifact
        id: deployment
        if: steps.current.outputs.current == 'true'
        continue-on-error: true
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          timeout: 600000

      - name: Verify selected revision and manifest are exactly live
        id: smoke
        if: steps.current.outputs.current == 'true'
        continue-on-error: true
        shell: bash
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          attempt=1
          while [ "$attempt" -le 12 ]; do
            if python3 - <<'PY'
          import hashlib
          import os
          import urllib.error
          import urllib.request

          url = "https://navnoorbawa.github.io/navnoor-research/release.json"


          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):  # noqa: ANN001
                  raise urllib.error.URLError(f"redirect refused: {newurl}")


          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())
          with opener.open(url, timeout=20) as response:
              payload = response.read(20_001)
              if response.status != 200 or response.geturl() != url:
                  raise SystemExit("release manifest was not exact HTTP 200")
          if len(payload) > 20_000:
              raise SystemExit("release manifest exceeded the fixed byte ceiling")
          actual = hashlib.sha256(payload).hexdigest()
          if actual != os.environ["EXPECTED_MANIFEST_SHA256"]:
              raise SystemExit("live release manifest does not match the rebuilt rollback")
          PY
            then
              break
            fi
            if [ "$attempt" -lt 12 ]; then
              sleep 10
            fi
            attempt=$((attempt + 1))
          done
          if [ "$attempt" -gt 12 ]; then
            exit 1
          fi
          python3 smoke_test_site.py \
            --expected-revision "$RELEASE_SHA" \
            --url 'https://navnoorbawa.github.io/navnoor-research/'

      - name: Prove post-rollback workflow authority
        id: post
        if: always() && steps.current.outputs.current == 'true'
        shell: bash
        env:
          REMOTE_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail
          remote_main=$(
            git ls-remote --exit-code "$REMOTE_URL" refs/heads/main |
              awk 'NR == 1 { print $1 }'
          )
          [[ "$remote_main" =~ ^[0-9a-f]{40}$ ]]
          if [ "$remote_main" != "$GITHUB_SHA" ]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Rollback superseded after deploy::New main $remote_main owns certification."
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"

      - name: Reconcile rollback outcome
        if: >-
          always()
          && steps.current.outputs.current == 'true'
          && steps.post.outcome == 'success'
          && steps.post.outputs.current == 'true'
        shell: bash
        env:
          DEPLOYMENT_OUTCOME: ${{ steps.deployment.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          set -euo pipefail
          if [ "$SMOKE_OUTCOME" != "success" ]; then
            echo "::error title=Rollback certification failed::The selected exact release is not verified live."
            exit 1
          fi
          if [ "$DEPLOYMENT_OUTCOME" = "failure" ]; then
            echo "::notice title=Late rollback completion verified::Pages reported failure, but the exact selected release is live."
          elif [ "$DEPLOYMENT_OUTCOME" != "success" ]; then
            echo "::error title=Rollback outcome unavailable::Pages did not report a completed outcome."
            exit 1
          fi
